<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ojek Online Simulator</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--green:#12a864;--green2:#087a4a;--mint:#eafff4;--ink:#17231d;--muted:#748179;--line:#e2ebe6;--bg:#f3f8f5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#e9fff3 0,#f3f8f5 35%,#eef4f1 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;position:sticky;top:0;z-index:1000}
.logo{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:950;letter-spacing:-.7px}.logo i{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#19b96f,#07834d);color:#fff;display:grid;place-items:center;font-style:normal;box-shadow:0 10px 22px #12a86435}
.shell{max-width:1440px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:320px minmax(0,1fr) 320px;gap:18px}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(220,232,225,.95);border-radius:26px;box-shadow:0 18px 55px rgba(18,54,37,.10);overflow:hidden}
.panel{padding:23px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#7d8b84;font-weight:950}
h1{font-size:29px;line-height:1.05;margin:7px 0 9px;letter-spacing:-1.2px}.muted{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 20px}
.field{border:1px solid var(--line);border-radius:17px;padding:11px 13px;margin:10px 0;background:#fbfdfc;transition:.2s}.field:focus-within{border-color:#75d4a8;box-shadow:0 0 0 4px #12a86412;background:#fff}
.field label{display:block;font-size:9px;color:#829089;text-transform:uppercase;letter-spacing:1px;font-weight:950;margin-bottom:5px}.field input{border:0;outline:0;width:100%;background:transparent;font-size:13px;font-weight:650;color:var(--ink)}
.actions{display:flex;gap:9px;margin:13px 0}.actions button{border:0;cursor:pointer;border-radius:15px;height:46px;font-weight:900;transition:.2s}.actions #swap{width:46px;background:#edf7f1;color:#087a4a;font-size:19px}.actions #calculate{flex:1;background:linear-gradient(135deg,#18ad68,#07844d);color:#fff;box-shadow:0 10px 22px #12a8642e}.actions #calculate:hover{transform:translateY(-1px);box-shadow:0 13px 25px #12a86438}.actions #calculate:disabled{opacity:.65;cursor:wait;transform:none}
.status{min-height:19px;color:#75827b;font-size:11px;margin:5px 2px 13px}.status.ok{color:#0a8a52}.status.error{color:#d34b4b}
.ride{border-radius:21px;background:linear-gradient(145deg,#f8fffb,#e4f8ed);border:1px solid #d7eee2;padding:17px;position:relative;overflow:hidden}.ride:before{content:"";position:absolute;width:125px;height:125px;border-radius:50%;right:-50px;top:-62px;background:#d5f2e2}.ride-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.ride-name{font-size:20px;font-weight:950;color:#087a4a}.ride-chip{font-size:9px;font-weight:950;background:#d7f2e3;color:#087a4a;padding:6px 9px;border-radius:999px}.scoot{font-size:54px;margin:13px 0 5px;position:relative;z-index:1;filter:drop-shadow(0 7px 7px #0002)}.ride-copy{font-size:11px;color:#66766e;line-height:1.5;margin:0;position:relative;z-index:1}
.map{position:relative;height:650px}#map{height:100%;width:100%}.map-pill{position:absolute;z-index:500;top:16px;left:16px;background:rgba(255,255,255,.94);border:1px solid #e4ebe7;padding:10px 13px;border-radius:14px;box-shadow:0 9px 24px #00000012;font-size:11px;font-weight:900}.map-distance{left:auto;right:16px;color:#087a4a}
.fare-panel{padding:25px;background:radial-gradient(circle at 95% 0%,#187d50 0,#123a28 34%,#0c2418 100%);color:#fff;height:100%;min-height:650px;position:relative;overflow:hidden}.fare-panel:before,.fare-panel:after{content:"";position:absolute;border:1px solid #ffffff10;border-radius:50%;pointer-events:none}.fare-panel:before{width:280px;height:280px;right:-135px;top:-120px}.fare-panel:after{width:170px;height:170px;right:-80px;top:-65px}
.fare-label{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#abd0bc;font-weight:950;position:relative;z-index:1}.fare{font-size:48px;font-weight:950;letter-spacing:-2.2px;margin:12px 0 30px;line-height:1;position:relative;z-index:1}
.distance{border:1px solid #ffffff18;background:#ffffff0b;border-radius:19px;padding:17px;position:relative;z-index:1}.distance small{font-size:9px;text-transform:uppercase;letter-spacing:1.1px;color:#a8c9b8;font-weight:950}.distance strong{display:block;font-size:29px;margin-top:6px;letter-spacing:-.7px}
.slogan{margin-top:25px;padding:18px;border-radius:19px;background:linear-gradient(135deg,#ffffff12,#ffffff06);border:1px solid #ffffff14;color:#e0eee7;font-size:14px;line-height:1.55;font-weight:850;position:relative;z-index:1}.slogan span{font-size:11px;color:#b8d0c4;font-weight:600}
.leaflet-control-attribution{font-size:8px}
@media(max-width:1080px){.grid{grid-template-columns:1fr 1fr}.map-card{grid-column:1/-1}.map{height:520px}.fare-panel{min-height:430px}}
@media(max-width:720px){.top{padding:0 15px}.shell{padding:14px}.grid{display:flex;flex-direction:column}.map-card{order:2}.left-card{order:1}.right-card{order:3}.map{height:430px}.logo{font-size:17px}}
</style></head><body>
<header class="top"><div class="logo"><i>⌁</i><span>Ojek Online Simulator</span></div></header>
<main class="shell"><div class="grid">
<section class="card panel left-card"><div class="kicker">Perjalanan</div><h1>Pesan perjalanan</h1><p class="muted">Tentukan lokasi jemput dan tujuan perjalananmu.</p><div class="field"><label>Lokasi jemput</label><input id="pickup" placeholder="Masukkan lokasi jemput"></div><div class="field"><label>Tujuan</label><input id="destination" placeholder="Masukkan tujuan"></div><div class="actions"><button id="swap">↕</button><button id="calculate">Hitung perjalanan</button></div><div class="status" id="status"></div><div class="ride"><div class="ride-top"><div class="ride-name">O-Ride</div><div class="ride-chip">MOTOR</div></div><div class="scoot">🛵</div><p class="ride-copy">Nyaman, aman, dan siap menemani perjalananmu.</p></div></section>
<section class="card map-card"><div class="map"><div class="map-pill">📍 Rute perjalanan</div><div class="map-pill map-distance" id="mapDistance">— km</div><div id="map"></div></div></section>
<section class="card right-card"><div class="fare-panel"><div class="fare-label">Tarif</div><div class="fare" id="fare">Rp0</div><div class="distance"><small>Jarak</small><strong id="shownKm">0 km</strong></div><div class="slogan">O-Ride<br><span>Nyaman, aman, dan praktis.</span></div></div></section>
</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const RATE=2500;
const BASE_FARE=8000;
const $=id=>document.getElementById(id);
const money=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
let map=L.map('map').setView([-3.79,102.26],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let routeLayer=null,markers=[];
function status(t,c=''){ $('status').textContent=t; $('status').className='status '+c; }
function swapLoc(){let x=$('pickup').value;$('pickup').value=$('destination').value;$('destination').value=x;}
async function geocode(q){
 const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q='+encodeURIComponent(q);
 const r=await fetch(u,{headers:{Accept:'application/json'}});
 if(!r.ok)throw Error('Pencarian lokasi gagal');
 const d=await r.json();if(!d.length)throw Error('Lokasi tidak ditemukan: '+q);
 return {lat:+d[0].lat,lon:+d[0].lon};
}
function clearMap(){if(routeLayer)map.removeLayer(routeLayer);markers.forEach(m=>map.removeLayer(m));markers=[];}
async function calculate(){
 const from=$('pickup').value.trim(),to=$('destination').value.trim();
 if(!from||!to){status('Isi titik penjemputan dan tujuan.','error');return}
 $('calculate').disabled=true;$('calculate').textContent='Menghitung...';status('Mencari lokasi dan menghitung rute...');
 try{
  const [a,b]=await Promise.all([geocode(from),geocode(to)]);
  const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
  const r=await fetch(u);if(!r.ok)throw Error('Layanan rute gagal');
  const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)throw Error('Rute tidak ditemukan');
  const rawKm=d.routes[0].distance/1000;
  // KUNCI KONSISTENSI: angka yang ditampilkan = angka yang dipakai menghitung tarif.
  const km=Math.round(rawKm*10)/10;
  const fare=BASE_FARE+(km*RATE);
  const mins=Math.max(1,Math.round(d.routes[0].duration/60));

  clearMap();
  routeLayer=L.geoJSON(d.routes[0].geometry,{style:{color:'#147df5',weight:6,opacity:.92}}).addTo(map);
  markers=[
    L.circleMarker([a.lat,a.lon],{radius:9,color:'#fff',weight:4,fillColor:'#00a83b',fillOpacity:1}).addTo(map),
    L.circleMarker([b.lat,b.lon],{radius:9,color:'#fff',weight:4,fillColor:'#ed4c4c',fillOpacity:1}).addTo(map)
  ];
  map.fitBounds(routeLayer.getBounds(),{padding:[55,55]});

  const shown=km.toFixed(1).replace('.',',')+' km';
  $('shownKm').textContent=shown;
  $('fare').textContent=money(fare);
  status('Rute berhasil dihitung. Jarak dan tarif sudah konsisten.','ok');
 }catch(e){console.error(e);status('Rute tidak dapat dihitung. Periksa nama tempat dan coba lagi.','error')}
 finally{$('calculate').disabled=false;$('calculate').textContent='⌕  Hitung Jarak & Tarif'}
}
window.addEventListener('load', calculate);</script><script>
window.addEventListener("load",()=>{
  const p=document.getElementById("pickup"), d=document.getElementById("destination");
  const calc=document.getElementById("calculate"), swap=document.getElementById("swap");
  if(!p.value)p.value="Universitas Negeri Bengkulu";
  if(!d.value)d.value="Pantai Panjang Bengkulu";
  calc.addEventListener("click",calculate);
  swap.addEventListener("click",()=>{const x=p.value;p.value=d.value;d.value=x;calculate();});
  setTimeout(calculate,250);
});
</script></body></html>
